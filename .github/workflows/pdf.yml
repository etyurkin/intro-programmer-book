name: Build books

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: books-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"

      - name: Install fonts and pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core pandoc

      - run: make books

      - uses: actions/upload-artifact@v4
        with:
          name: books
          path: |
            out/intro-k-professii-programmist.pdf
            out/intro-k-professii-programmist.epub
            out/intro-to-the-programming-profession.pdf
            out/intro-to-the-programming-profession.epub
          if-no-files-found: error

      - name: Publish latest books
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdfs
          name: Latest books
          body: |
            Built from ${{ github.sha }}.
            Russian: `intro-k-professii-programmist.pdf` / `.epub`
            English: `intro-to-the-programming-profession.pdf` / `.epub`
          files: |
            out/intro-k-professii-programmist.pdf
            out/intro-k-professii-programmist.epub
            out/intro-to-the-programming-profession.pdf
            out/intro-to-the-programming-profession.epub
          fail_on_unmatched_files: true
          make_latest: true
