name: Build books

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13
        with:
          typst-version: "0.15.1"

      - name: Install fonts and pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core pandoc

      - run: make books

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: books
          path: |
            out/intro-k-professii-programmist.pdf
            out/intro-k-professii-programmist.epub
            out/intro-to-the-programming-profession.pdf
            out/intro-to-the-programming-profession.epub
          if-no-files-found: error
